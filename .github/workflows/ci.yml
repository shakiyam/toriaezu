name: CI
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test installation (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # oraclelinux8 is excluded until mise puts aqua binaries in archive subdirectories on PATH there (see TODO.md)
        os:
          - oraclelinux9
          - ubuntu24
          - ubuntu26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run make test-${{ matrix.os }}
        run: make test-${{ matrix.os }}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
