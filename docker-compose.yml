services:
  oraclelinux8:
    build:
      context: .
      args:
        BASE_IMAGE: oraclelinux:8
    volumes:
      - ./scripts:/home/testuser/toriaezu/scripts:ro,z
      - ./bin:/home/testuser/toriaezu/bin:ro,z
      - ./Makefile:/home/testuser/toriaezu/Makefile:ro,z
      - ./provision.sh:/home/testuser/toriaezu/provision.sh:ro,z
    environment:
      - MISE_GITHUB_TOKEN
    command: /bin/bash
    tty: true
    stdin_open: true

  oraclelinux9:
    build:
      context: .
      args:
        BASE_IMAGE: oraclelinux:9
